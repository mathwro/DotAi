name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavioral suite
        run: python -m unittest discover -s tests -v
      - name: Validate tracked baseline without initializing user configuration
        run: python dotai.py --manifest stack.example.json validate

  coverage:
    name: Linux branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install CI-only coverage tool
        run: python -m pip install "coverage>=7.6,<8"
      - name: Measure application branch coverage
        run: python -m coverage run --branch --source=dotai_app -m unittest discover -s tests -v
      - name: Generate coverage reports
        if: always()
        run: |
          python -m coverage report -m
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-branch-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
